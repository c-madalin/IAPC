# Active when a service runs on the host through `make dev svc=<name>` (SPRING_PROFILES_ACTIVE=hostdev).
# Everything else runs in Docker. Containers reach this service through host.docker.internal; this service
# reaches the containers on the 127.0.0.1 ports that compose.dev.yaml publishes.
eureka.instance.hostname=host.docker.internal
rag.clients.urls.retrieval-pre=http://localhost:8084
rag.clients.urls.retrieval-post=http://localhost:8085
rag.clients.urls.rag-api=http://localhost:8081
rag.clients.urls.ingest-static=http://localhost:8082
rag.clients.urls.ingest-dynamic=http://localhost:8083
