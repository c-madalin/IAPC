# Defaults for every service that depends on rag-platform. A service's application.yaml overrides any of these.

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# OpenTelemetry export to the grafana/otel-lgtm container ("obs" compose profile). Off unless OTEL_ENABLED=true,
# so services don't log connection errors when the profile isn't running.
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${OTEL_ENABLED:false}
management.logging.export.otlp.enabled=${OTEL_ENABLED:false}
management.otlp.metrics.export.enabled=${OTEL_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4318}/v1/logs
management.otlp.metrics.export.url=${OTEL_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.base-time-unit=seconds
management.opentelemetry.resource-attributes.deployment.environment=${DEPLOY_ENV:local}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.lease-renewal-interval-in-seconds=10

logging.level.ro.iapc=INFO
