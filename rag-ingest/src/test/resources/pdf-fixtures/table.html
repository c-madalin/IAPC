<h1>Table incident response fixture</h1>
<p>The incident response team records each security event in the following table.</p>
<table border="1" cellpadding="8">
  <tr><th>Severity</th><th>Response time</th><th>Notification target</th></tr>
  <tr><td>Low</td><td>Five working days</td><td>Team lead</td></tr>
  <tr><td>Medium</td><td>Twenty-four hours</td><td>Security team</td></tr>
  <tr><td>High</td><td>One hour</td><td>Security team and management</td></tr>
</table>
</body>
