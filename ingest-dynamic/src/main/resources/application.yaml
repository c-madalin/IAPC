server:
  port: 8083

spring:
  application:
    name: ingest-dynamic
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${POSTGRES_USER:rag}
    password: ${POSTGRES_PASSWORD:}

rag:
  store:
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    default-model: ${EMBEDDING_MODEL:nomic-embed-text}
  dynamic:
    # Read by Story 2 code. Compose can't block internal IP ranges; the fetcher must.
    webhook-secret: ${VENDOR_WEBHOOK_SECRET:}
    block-private-networks: ${INGEST_BLOCK_PRIVATE_NETWORKS:true}
