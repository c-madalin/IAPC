version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Boot, Cloud and AI versions must move together (see the comment in pom.xml), so review them as one PR.
      spring:
        patterns: ["org.springframework*"]
      test:
        patterns: ["org.testcontainers*", "org.junit*", "org.assertj*", "org.mockito*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
